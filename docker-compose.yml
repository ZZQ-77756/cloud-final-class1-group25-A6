version: '3'
services:
  # 服务 1: 前端 Nginx
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./src:/usr/share/nginx/html      # 挂载网页
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf # 挂载配置
    depends_on:
      - backend

  # 服务 2: 后端 Python
  backend:
    build: ./backend
    environment:
      - STUDENT_NAME=Group25
    depends_on:
      - redis

  # 服务 3: 数据库 Redis
  redis:
    image: redis:alpine
